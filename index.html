<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kebun Isometrik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="farm-root">
    <div id="farm-hud">
      <div class="title">🌾 Kebun Isometrik</div>
      <div class="stats">
        <div class="stat">🪙 <span id="hud-gold">40</span></div>
        <div class="stat">🪵 <span id="hud-wood">0</span></div>
        <div class="stat">🪨 <span id="hud-stone">0</span></div>
        <div class="stat">⭐ Lv<span id="hud-level">1</span></div>
      </div>
    </div>

    <div id="farm-canvas-wrap">
      <canvas id="farm-canvas" width="960" height="600"></canvas>
      <div id="farm-toast"></div>
      <div id="farm-seedmenu"></div>
    </div>
    <div id="farm-hint">Klik tile buat jalan (karakter otomatis muter ngehindar pohon/batu) · tanah coklat buat tanam · pohon &amp; batu buat kumpulin bahan</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
